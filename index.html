
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>Alex Fashion Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold: #d5b078;
    --muted: #99938a;
    --bg: #101010;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 42px 18px;
    color: #f5f0e7;
    font-family: "DM Sans", sans-serif;

    background:
        radial-gradient(
            ellipse at 50% 8%,
            rgba(183,143,83,.16),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 0% 100%,
            rgba(183,143,83,.07),
            transparent 32%
        ),
        var(--bg);

    overflow-x: hidden;
    position: relative;
}

/* Background texture */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .10;

    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
}

.page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 500px;
    text-align: center;
}

/* Business logo */

.brand-logo {
    display: flex;
    /* width: min(200px, 76vw); */
    width: 250px;
    /* height: auto; */
    margin: 0 auto;
}

/* Tagline */

.tagline {
    color: var(--gold);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 25px;
}

/* Divider */

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    margin: 0 auto 30px;
}

.divider span {
    width: 58px;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--gold)
    );
}

.divider span:last-child {
    transform: rotate(180deg);
}

.divider i {
    width: 7px;
    height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
}

/* Link cards */

.links {
    display: grid;
    gap: 14px;
}

.link {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 78px;
    padding: 16px 18px;

    color: #f5f0e7;
    text-decoration: none;
    text-align: left;

    position: relative;
    overflow: hidden;

    background: linear-gradient(
        120deg,
        rgba(37,35,31,.96),
        rgba(25,24,22,.96)
    );

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 15px;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

/* Hover animation */

.link::before {
    content: "";
    position: absolute;
    top: 0;
    left: -110%;
    width: 100%;
    height: 100%;

    background: linear-gradient(
        100deg,
        transparent,
        rgba(213,176,120,.09),
        transparent
    );

    transition: .5s;
}

.link:hover::before {
    left: 110%;
}

.link:hover {
    transform: translateY(-3px);
    border-color: rgba(213,176,120,.6);
    box-shadow: 0 10px 28px rgba(0,0,0,.25);
}

/* Icons */

.icon {
    width: 45px;
    height: 45px;
    flex: 0 0 45px;

    display: grid;
    place-items: center;

    border-radius: 12px;
    color: var(--gold);
    background: rgba(213,176,120,.09);
    border: 1px solid rgba(213,176,120,.13);
}

.icon svg {
    width: 21px;
    height: 21px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* Text */

.copy {
    flex: 1;
}

.title {
    display: block;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .2px;
}

.desc {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
}

/* Arrow */

.arrow {
    color: #a18b69;
    font-size: 21px;
    transition: .25s;
}

.link:hover .arrow {
    color: #edcf9a;
    transform: translate(3px,-3px);
}

/* Footer */

footer {
    margin-top: 30px;
}

.footer-line {
    width: 45px;
    height: 1px;
    background: rgba(213,176,120,.45);
    margin: 0 auto 14px;
}

footer p {
    color: #81796e;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* Mobile responsive */

@media (max-width: 400px) {
    body {
        padding: 32px 16px;
    }

    .link {
        min-height: 70px;
        padding: 14px;
        gap: 12px;
    }

    .title {
        font-size: 14px;
    }

    .desc {
        font-size: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition: none !important;
    }
}
</style>
</head>

<body>

<main class="page">

    <!-- Actual Business Logo -->
    <img
        class="brand-logo"
        src="logo.png"
        alt="Alex Fashion Store Logo"
    >

    <p class="tagline">
        Menswear · Style · Quality
    </p>

    <!-- Decorative Divider -->
    <div class="divider">
        <span></span>
        <i></i>
        <span></span>
    </div>

    <!-- Business Links -->
    <nav class="links" aria-label="Business links">

        <!-- Instagram -->
        <a
            class="link"

        <!-- WhatsApp Group -->

            target="_blank"

        >
            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/>
                    <path d="M9 8.5c.5 2.5 2 4 4.5 5l1-1 2 1c-.3 1.4-1.2 2-2.5 1.8-3.7-.7-6.2-3.2-6.9-6.9C7 7.1 7.6 6.2 9 6l1 2-1 1"/>
                </svg>
            </span>

            <span class="copy">
                <span class="title">WhatsApp Group</span>
                <span class="desc">Join for updates and new arrivals</span>
            </span>

            <span class="arrow">↗</span>
        </a>

        <!-- Store Location -->
        <a
            class="link"
            href="https://maps.app.goo.gl/gzc4j843EewowHsA6"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                    <circle cx="12" cy="10" r="2.5"/>
                </svg>
            </span>

            <span class="copy">
                <span class="title">Visit Our Store</span>
                <span class="desc">Get directions to our location</span>
            </span>

            <span class="arrow">↗</span>
        </a>

        <!-- Google Reviews -->
        <a
            class="link"
            href="https://search.google.com/local/writereview?placeid=ChIJu_kJs_qXyzsRropWlEfz5Fc"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/>
                </svg>
            </span>

            <span class="copy">
                <span class="title">Google Reviews</span>
                <span class="desc">Share your experience with us</span>
            </span>

            <span class="arrow">↗</span>
        </a>

    </nav>

    <!-- Footer -->
    <footer>
        <div class="footer-line"></div>
        <p>Thank You For Choosing Us</p>
    </footer>

</main>

</body>
</html>
